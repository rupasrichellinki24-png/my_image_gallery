<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h2>📷 My Gallery</h2>
      <span>Memories, beautifully collected</span>
    </header>

    <main>
      <section class="heading">
        <h1>Image Gallery</h1>
        <p>Click any photo to view, zoom and explore.</p>
      </section>

      <div class="gallery" id="gallery">
        <img src="assets/photo1.jpg" alt="Photo 1" />
        <img src="assets/photo2.jpg" alt="Photo 2" />
        <img src="assets/photo3.jpg" alt="Photo 3" />
        <img src="assets/photo4.jpg" alt="Photo 4" />
        <img src="assets/photo5.jpg" alt="Photo 5" />
        <img src="assets/photo6.jpg" alt="Photo 6" />
        <img src="assets/photo7.jpg" alt="Photo 7" />
        <img src="assets/photo8.jpg" alt="Photo 8" />
        <img src="assets/photo9.jpg" alt="Photo 9" />
        <img src="assets/photo10.jpg" alt="Photo 10" />
        <img src="assets/photo11.jpg" alt="Photo 11" />
        <img src="assets/photo12.jpg" alt="Photo 12" />
        <img src="assets/photo13.jpg" alt="Photo 13" />
        <img src="assets/photo14.jpg" alt="Photo 14" />
        <img src="assets/photo15.jpg" alt="Photo 15" />
      </div>
    </main>

    <div class="viewer" id="viewer" aria-hidden="true">
      <div class="viewer-top">
        <span id="counter">1 / 15</span>
        <div class="viewer-actions">
          <button id="zoomOut" title="Zoom out">−</button>
          <span id="zoomLevel">100%</span>
          <button id="zoomIn" title="Zoom in">+</button>
          <button id="resetZoom" title="Reset zoom">⟲</button>
          <button id="fullscreen" title="Toggle fullscreen">⛶</button>
          <button id="close" title="Close">✕</button>
        </div>
      </div>

      <button class="nav prev" id="prev" aria-label="Previous photo">‹</button>

      <div class="photo-area" id="photoArea">
        <img id="largePhoto" alt="Selected photo" />
      </div>

      <button class="nav next" id="next" aria-label="Next photo">›</button>

      <div class="filmstrip" id="filmstrip"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
